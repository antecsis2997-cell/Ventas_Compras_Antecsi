server:
  port: 8080

# CORS: orígenes permitidos (coma separados)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:programador@antecsis.pe}
  suscripciones:
    alerta-cron: ${SUSCRIPCION_ALERTA_CRON:0 0 8 * * ?}  # 8:00 AM diario
    # Avisar por correo si la suscripción vence dentro de N días (licencia próxima a caducar)
    alerta-proximo-dias: ${SUSCRIPCION_ALERTA_PROXIMO_DIAS:7}

# Logging base (dev/prod pueden sobrescribir)
logging:
  level:
    org.springframework.security: WARN
    org.hibernate: WARN
    # Logs de facturación electrónica SUNAT: siempre visibles en cualquier perfil
    com.antecsis.service.sunat: INFO

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mail:
    host: ${MAIL_HOST:mail.antecsis.pe}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:programador@antecsis.pe}
    password: ${MAIL_PASSWORD:Antecsis@2026}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ventas_db}
    username: ${DB_USERNAME:ventas_user}
    password: ${DB_PASSWORD:PasswordSeguro123}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public

  sql:
    init:
      mode: never

# JWT: en producción definir JWT_SECRET, JWT_EXPIRATION, JWT_REFRESH_EXPIRATION por variable de entorno
jwt:
  secret: ${JWT_SECRET:CLAVE_SUPER_SECRETA_123456789_ANTECSIS_SEGURA_2026}
  expiration: ${JWT_EXPIRATION:3600000}       # Access token: 1 hora (ms)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # Refresh token: 7 días (ms)

# Licencias de plan (JWT firmado distinto al de sesión; mín. 32 caracteres)
license:
  jwt:
    secret: ${LICENSE_JWT_SECRET:LICENCIA_ANTECSIS_CLAVE_MINIMO_32_CARACTERES_2026}

cmr:
  base-url: ${CMR_BASE_URL:https://api.cmr.mock}
  api-key: ${CMR_API_KEY:demo-key}
  puntos-por-transaccion: ${CMR_PUNTOS_POR_TRANSACCION:100}

payu:
  sandbox-url: ${PAYU_SANDBOX_URL:https://sandbox.api.payulatam.com/payments-api/4.0/service.cgi}
  api-login: ${PAYU_API_LOGIN:pRRXKOl8ikMmt9u}
  api-key: ${PAYU_API_KEY:4Vj8eK4rloUd272L48hsrarnUA}
  account-id: ${PAYU_ACCOUNT_ID:512323}
  merchant-id: ${PAYU_MERCHANT_ID:508029}
  test: ${PAYU_TEST:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Facturación Electrónica SUNAT (SEE del Contribuyente) ──
sunat:
  beta:
    endpoint-factura: ${SUNAT_BETA_ENDPOINT_FACTURA:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
    endpoint-resumen: ${SUNAT_BETA_ENDPOINT_RESUMEN:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
  produccion:
    endpoint-factura: ${SUNAT_PROD_ENDPOINT_FACTURA:https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService}
    endpoint-resumen: ${SUNAT_PROD_ENDPOINT_RESUMEN:https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService}
  resumen:
    cron: ${SUNAT_RESUMEN_CRON:0 0 23 * * ?}   # 11 PM diario
  cifrado:
    # Clave AES-256 para cifrar credenciales SOL y certificado PFX (debe ser 32 chars)
    clave: ${SUNAT_CIFRADO_CLAVE:AntecsisSunatKey2026Secure!1234}
